services:    
    api:
        build: .
        volumes:
            - ./alembic/versions:/app/alembic/versions
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        ports:
            - "8000:8000"
        command: fastapi run app/main.py --port 8000

    worker:
        build: .
        env_file:
            - .env
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        command: rq worker api_monitor

    scheduler:
        build: .
        env_file:
            - .env
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_started
            migrate:
                condition: service_completed_successfully
        command: python -m app.workers.scheduler

    redis:
        image: redis:8-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s

    postgres:
        image: postgres:18
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s

    migrate:
        build: .
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
        command: alembic upgrade head
        restart: "no"

volumes:
    postgres_data: